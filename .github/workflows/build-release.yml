name: Build and Release Extensions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: CookieInspector
            slug: cookie-inspector
          - dir: StreamDetector
            slug: stream-detector
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web-ext
        run: npm install -g web-ext

      - name: Read version from manifest
        run: |
          BASE_VERSION=$(jq -r .version "${{ matrix.dir }}/manifest.json")
          FULL_VERSION="${BASE_VERSION}.${{ github.run_number }}"
          echo "VERSION=$FULL_VERSION" >> "$GITHUB_ENV"
          echo "BASE_VERSION=$BASE_VERSION" >> "$GITHUB_ENV"
          echo "ZIP_NAME=${{ matrix.slug }}-${FULL_VERSION}-chrome.zip" >> "$GITHUB_ENV"
          echo "XPI_NAME=${{ matrix.slug }}-${FULL_VERSION}-firefox.xpi" >> "$GITHUB_ENV"
          echo "SIGN_DIR=/tmp/sign-${{ matrix.slug }}" >> "$GITHUB_ENV"

      - name: Prepare versioned source (unique version per run for AMO)
        run: |
          rm -rf "$SIGN_DIR"
          cp -r "${{ matrix.dir }}" "$SIGN_DIR"
          jq --arg v "$VERSION" '.version = $v' "$SIGN_DIR/manifest.json" > "$SIGN_DIR/manifest.json.tmp" && mv "$SIGN_DIR/manifest.json.tmp" "$SIGN_DIR/manifest.json"
          grep '"version"' "$SIGN_DIR/manifest.json"

      - name: Build Chrome zip
        run: |
          cd "$SIGN_DIR"
          zip -r "$GITHUB_WORKSPACE/$ZIP_NAME" . -x '.*'

      - name: Lint Firefox extension
        run: web-ext lint --source-dir="$SIGN_DIR"

      - name: Build + sign Firefox .xpi (AMO, unlisted)
        run: |
          mkdir -p dist-signed
          web-ext sign \
            --source-dir="$SIGN_DIR" \
            --artifacts-dir=dist-signed \
            --channel=unlisted \
            --api-key="${{ secrets.AMO_JWT_ISSUER }}" \
            --api-secret="${{ secrets.AMO_JWT_SECRET }}" \
            --timeout=900000
          SIGNED=$(ls -t dist-signed/*.xpi | head -n 1)
          cp "$SIGNED" "$XPI_NAME"
          ls -lh "$ZIP_NAME" "$XPI_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}-files
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.XPI_NAME }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: List files
        run: ls -lhR release-files

      - name: Set last update date
        run: echo "LAST_UPDATE=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"

      - name: Publish rolling Release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: init
          body: |
            Last update: ${{ env.LAST_UPDATE }}
          files: release-files/*
          make_latest: true
